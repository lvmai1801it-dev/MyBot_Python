[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
include = ["COCbot/core", "COCbot/models", "tests", "run.py"]
extend-exclude = ["_archive_old_code"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["COCbot/core", "COCbot/models"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.importlinter]
root_packages = ["COCbot"]

[[tool.importlinter.contracts]]
name = "Core and models must not import legacy UI or game layers"
type = "forbidden"
source_modules = ["COCbot.core", "COCbot.models"]
forbidden_modules = [
    "COCbot.gui",
    "COCbot.app",
    "COCbot.attack",
    "COCbot.game",
    "COCbot.vision",
    "COCbot.platform",
    "COCbot.emulator",
]
