name: webui

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-syntax:
    name: Python syntax gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # compileall only parses - no PyQt/OpenCV deps needed here. The full
      # unit suite (106 tests) stays local: it needs the heavy CV stack
      # (PaddleOCR, ultralytics, onnxruntime) that is not CI-friendly.
      # The frontend build job will return together with the catalog-driven
      # UI (no node toolchain in the tree right now).
      - name: compileall
        run: python -m compileall -q COCbot tools run.py run_web.py
